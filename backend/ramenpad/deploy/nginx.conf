# Add inside the existing api.yougotcoined.com server block.
location = /health/ramenpad {
    proxy_pass http://127.0.0.1:4311/health/ramenpad;
    proxy_set_header Host $host;
}

location /api/ramenpad/ {
    proxy_pass http://127.0.0.1:4311/api/ramenpad/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location /ramenpad/uploads/ {
    proxy_pass http://127.0.0.1:4311/ramenpad/uploads/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /ramenpad/socket.io/ {
    proxy_pass http://127.0.0.1:4311/ramenpad/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
}
